<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupus</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img src="assets/icon.png" alt="" class="topbar-icon">
    <img src="assets/logo.png" alt="Lupus" class="topbar-logo">
    <div class="topbar-spacer"></div>
    <label class="lang">
      <span class="sr-only" data-i18n="language">Language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
        <option value="hi">हिन्दी</option>
        <option value="ko">한국어</option>
      </select>
    </label>
  </header>

  <main class="layout">
    <aside class="panel">
      <section class="card planner">
        <div class="field">
          <label for="from" data-i18n="from">From</label>
          <div class="row">
            <input id="from" list="placeList" autocomplete="off">
            <button id="locate" class="icon-btn" title="Use my location" aria-label="Use my location">◎</button>
          </div>
        </div>
        <div class="field">
          <label for="to" data-i18n="to">To</label>
          <div class="row">
            <input id="to" list="placeList" autocomplete="off">
            <button id="swap" class="icon-btn" title="Swap" aria-label="Swap">⇅</button>
          </div>
        </div>
        <datalist id="placeList"></datalist>
        <div class="row gap">
          <select id="when">
            <option value="now" data-i18n="leaveNow">Leave now</option>
            <option value="at" data-i18n="leaveAt">Leave at…</option>
          </select>
          <input id="whenTime" type="time" hidden>
          <button id="go" class="primary" data-i18n="go">Go</button>
        </div>
        <div class="row gap wrap">
          <button id="nextClass" class="chip accent" data-i18n="nextClass">▶ Next class</button>
          <div id="savedChips" class="chips"></div>
        </div>
      </section>

      <section id="results" class="card" hidden>
        <h2 data-i18n="routes">Routes</h2>
        <ol id="options" class="options"></ol>
      </section>

      <section id="detail" class="card" hidden>
        <div class="row between">
          <h2 id="detailTitle"></h2>
          <button id="speak" class="chip" data-i18n="speak">🔊 Guide me</button>
        </div>
        <ol id="steps" class="steps"></ol>
      </section>

      <section id="trains" class="card" hidden>
        <h2 data-i18n="lirr">LIRR at Stony Brook</h2>
        <div id="trainList"></div>
      </section>

      <section id="nearby" class="card" hidden>
        <div class="row between">
          <h2 data-i18n="nearby">Nearby</h2>
          <button id="saveDest" class="chip" data-i18n="save">☆ Save</button>
        </div>
        <div id="nearbyBody"></div>
      </section>

      <details class="card">
        <summary data-i18n="schedule">My class schedule</summary>
        <form id="classForm" class="class-form">
          <input name="name" placeholder="CSE 214" required>
          <select name="place" id="classPlace"></select>
          <div class="days">
            <label><input type="checkbox" name="d" value="1">M</label>
            <label><input type="checkbox" name="d" value="2">T</label>
            <label><input type="checkbox" name="d" value="3">W</label>
            <label><input type="checkbox" name="d" value="4">Th</label>
            <label><input type="checkbox" name="d" value="5">F</label>
          </div>
          <input name="time" type="time" required>
          <button class="primary" data-i18n="add">Add</button>
        </form>
        <ul id="classList" class="class-list"></ul>
      </details>

      <details class="card">
        <summary data-i18n="shortcuts">Student shortcuts</summary>
        <ul id="shortcutList" class="class-list"></ul>
      </details>
    </aside>

    <div id="map" class="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
