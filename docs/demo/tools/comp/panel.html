<html><head><style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;
 background:radial-gradient(1200px 800px at 15% 20%,#dbe8ff 0,transparent 60%),radial-gradient(1000px 700px at 90% 90%,#f6dcec 0,transparent 60%),#eef1f7;color:#111827;overflow:hidden}
.slot{position:absolute;left:250px;top:40px;width:462px;height:1000px;border-radius:52px;background:#000}
.txt{position:absolute;left:860px;top:150px;width:960px}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;color:#334}
.brand img{width:56px;height:56px}
.k{margin-top:60px;font-size:24px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#007aff}
h1{font-size:72px;line-height:1.05;margin-top:14px;letter-spacing:-.02em}
ul{list-style:none;padding:0;margin-top:40px}
li{font-size:32px;line-height:1.35;margin:0 0 22px;padding-left:46px;position:relative;color:#1f2937}
li:before{content:"";position:absolute;left:0;top:13px;width:18px;height:18px;border-radius:50%;background:#007aff}
.foot{position:absolute;left:860px;bottom:52px;font-size:20px;color:#6b7280}
</style></head><body>
<div class=slot></div>
<div class=txt><div class=brand><img src=icon.png>Lupus · Campus Transit</div>
<div class=k id=k></div><h1 id=h></h1><ul id=ul></ul></div>
<div class=foot id=f></div>
<script>
const q=new URLSearchParams(location.search), d=JSON.parse(q.get('d'));
k.textContent=d.k; h.textContent=d.h; f.textContent=d.f||''; ul.innerHTML=d.b.map(x=>`<li>${x}</li>`).join('');
</script></body></html>
